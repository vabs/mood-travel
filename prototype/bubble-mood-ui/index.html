<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Not part of the real site.

  Iteration 3, following feedback on iteration 2:
    - Leaf idea "1 — orbiting item-bubbles" won over the shelf/list and
      accordion ideas. Those two, and the switcher used to compare them,
      are deleted from this file.
    - The popover used to show item detail was rejected. Replaced with a
      recursive zoom: clicking an item-bubble morphs IT (not a new floating
      element) into a larger rounded shape at the center of the leaf stage,
      showing its own info inline. Siblings shrink/fade outward. This is the
      same interaction grammar already used one level up (click a mood
      bubble -> it centers/enlarges and reveals what's inside it) — now
      applied recursively at the item level. Click it again, click empty
      space, or press ESC to collapse back to the ring of item-bubbles.
    - All bubbles (field, type-bubbles, item-bubbles) now react on hover
      (scale up + brighten). Implementation note: field bubbles have their
      position/scale rewritten every animation frame via inline styles —
      a plain CSS `:hover{transform:...}` rule would be fought every frame
      by that JS, since inline style beats a stylesheet rule regardless of
      pseudo-class. Fixed by driving position/scale through CSS custom
      properties (--tx/--ty/--s) instead of inline `transform`, so the
      actual `transform` property is only ever declared in the stylesheet —
      :hover can then out-cascade the base rule normally, and JS keeps
      updating the custom properties every frame with no conflict.
    - ESC / back-button now "step back" one level at a time: collapse an
      expanded item first if one is open, THEN pop leaf -> ring -> field.

  Run: open this file directly in a browser (file://) — no build step.
  See NOTES.md in this folder for context and the running verdict.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Prototype — Bubble Mood UI</title>
<style>
  :root{
    --bg1:#f7f7fb; --bg2:#e9e9f2; --text:#1b1b1f; --card:#ffffff; --border:#dcdce4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg1:#17171c; --bg2:#0e0e12; --text:#eceef2; --card:#22222a; --border:#33333d; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);}
  body{background:radial-gradient(circle at 50% 35%, var(--bg1), var(--bg2));overflow:hidden;}

  #chrome{position:fixed;inset:0;}
  .search-wrap{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:50;}
  #searchInput{
    width:min(420px,70vw);padding:12px 18px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:15px;outline:none;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
  }

  .stage{position:absolute;inset:0;overflow:hidden;transition:transform .5s cubic-bezier(.4,0,.2,1), filter .5s ease;}
  .stage.zoomed{transform:scale(6);filter:blur(6px) brightness(.6);}
  .bubbles-layer{position:absolute;inset:0;}

  /* bigger bubbles per feedback. Position/scale driven by --tx/--ty/--s custom
     properties (set from JS) rather than inline `transform`, so :hover below
     can add its own scale on top without fighting the per-frame JS update. */
  .bubble{
    position:absolute;width:140px;height:140px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:14px;font-weight:600;color:#161616;cursor:pointer;user-select:none;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    transform:translate(-50%,-50%) scale(var(--s,1));
    transition:opacity .35s ease, filter .15s ease;
    padding:8px;line-height:1.2;
  }
  .bubble:hover{ transform:translate(-50%,-50%) scale(calc(var(--s,1) * 1.14)); filter:brightness(1.1); z-index:5; }
  .bubble.intense{width:165px;height:165px;font-weight:700;font-size:15px;}

  .back-btn{position:fixed;top:24px;left:24px;z-index:70;background:#111;color:#fff;border:none;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:13px;}
  .back-btn[hidden]{display:none;}

  /* --- ring view (mood open, choosing a media type) --- */
  .ring-view{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;}
  .ring-view.show{opacity:1;}
  .ring-view[hidden]{display:none;}
  .ring-tethers{position:absolute;inset:0;pointer-events:none;}
  .ring-tethers line{stroke:rgba(120,120,140,.45);stroke-width:1.5;stroke-dasharray:5 5;}
  .center-bubble{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:210px;height:210px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:19px;text-align:center;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);
  }
  .type-bubble{
    position:absolute;left:50%;top:50%;width:112px;height:112px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.16);
    text-align:center;padding:8px;animation:float 5s ease-in-out infinite alternate;
    transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px)));
    transition:filter .15s ease;
  }
  .type-bubble:hover{
    filter:brightness(1.08);
    transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(1.1);
    z-index:5;
  }
  .ring-explore{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:70vw;}

  /* --- leaf view (a type bubble is open) --- */
  .leaf-view{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;transition:opacity .3s ease;}
  .leaf-view.show{opacity:1;}
  .leaf-view[hidden]{display:none;}
  .leaf-header{font-size:15px;opacity:.75;}
  .leaf-header strong{opacity:1;}

  /* orbiting item-bubbles. Clicking one morphs it in place (recursive zoom,
     same grammar as the mood/type bubbles) instead of opening a popover. */
  .leaf-stage{position:relative;width:460px;height:460px;}
  .item-bubble{
    position:absolute;left:50%;top:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:11px;padding:8px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);color:#161616;
    transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(var(--s,1));
    transition:width .3s ease, height .3s ease, border-radius .3s ease, transform .3s ease, opacity .3s ease, filter .15s ease;
  }
  .item-bubble:hover{ filter:brightness(1.1); }
  .item-bubble:not(.expanded):hover{
    transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(calc(var(--s,1) * 1.1));
    z-index:5;
  }
  .item-bubble.expanded{
    border-radius:28px;text-align:left;cursor:default;box-shadow:0 16px 44px rgba(0,0,0,.3);z-index:6;
  }
  .item-detail{padding:6px 4px;}
  .item-detail h3{margin:0 0 8px;font-size:14px;}
  .item-detail p{margin:6px 0 0;font-size:11px;opacity:.75;}

  .tempo{font-size:11px;display:inline-block;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .tempo-quick{background:#dff5e1;color:#1f7a34;}
  .tempo-steady{background:#e1ecfa;color:#1c5aa8;}
  .tempo-slow-burn{background:#f3e3fb;color:#7a2ea8;}
  @media (prefers-color-scheme: dark){
    .tempo-quick{background:#173d20;color:#7fe39a;}
    .tempo-steady{background:#12294a;color:#8db6f2;}
    .tempo-slow-burn{background:#331a44;color:#d8a8f5;}
  }

  .chip{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:transform .15s ease;}
  .chip:hover{background:var(--bg2);transform:scale(1.06);}

  @keyframes float{ from{ margin-top:-6px; } to{ margin-top:6px; } }
</style>
</head>
<body>
  <div id="chrome">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Search a feeling… try “anxious”" autocomplete="off" />
    </div>

    <button class="back-btn" id="backBtn" hidden>← Back</button>

    <div class="stage" id="stage"><div class="bubbles-layer" id="bubblesLayer"></div></div>

    <div class="ring-view" id="ringView" hidden>
      <svg class="ring-tethers" id="ringTethers"></svg>
      <div class="ring-explore" id="ringExplore"></div>
      <div class="center-bubble" id="centerBubble"></div>
    </div>

    <div class="leaf-view" id="leafView" hidden>
      <div class="leaf-header" id="leafHeader"></div>
      <div id="leafBody"></div>
    </div>
  </div>

<script>
  // ---------- data ----------
  const FAMILY_CENTROIDS = {
    fear:{x:.25,y:.30}, anger:{x:.72,y:.24}, sadness:{x:.24,y:.74}, disgust:{x:.76,y:.72},
    joy:{x:.5,y:.12}, trust:{x:.88,y:.46}, anticipation:{x:.12,y:.46}, surprise:{x:.5,y:.90}
  };

  const MOODS = [
    {id:'fear', label:'Fear', valence:'neg', family:'fear', counterpart:'trust', synonyms:['anxious','worried','nervous','scared','afraid']},
    {id:'terror', label:'Terror', valence:'neg', family:'fear', intense:true, counterpart:'trust', synonyms:['terrified','panicked','dread']},
    {id:'anger', label:'Anger', valence:'neg', family:'anger', counterpart:'joy', synonyms:['angry','irritated','frustrated','mad','annoyed']},
    {id:'rage', label:'Rage', valence:'neg', family:'anger', intense:true, counterpart:'joy', synonyms:['furious','livid']},
    {id:'sadness', label:'Sadness', valence:'neg', family:'sadness', counterpart:'joy', synonyms:['sad','lonely','empty','down','blue']},
    {id:'grief', label:'Grief', valence:'neg', family:'sadness', intense:true, counterpart:'joy', synonyms:['grieving','heartbroken','devastated']},
    {id:'disgust', label:'Disgust', valence:'neg', family:'disgust', counterpart:'trust', synonyms:['disgusted','repulsed','gross','revolted']},
    {id:'joy', label:'Joy', valence:'pos', family:'joy', synonyms:['happy','joyful','glad','content']},
    {id:'ecstasy', label:'Ecstasy', valence:'pos', family:'joy', intense:true, synonyms:['elated','euphoric']},
    {id:'trust', label:'Trust', valence:'pos', family:'trust', synonyms:['trusting','safe','secure']},
    {id:'anticipation', label:'Anticipation', valence:'pos', family:'anticipation', synonyms:['hopeful','eager','excited']},
    {id:'surprise', label:'Surprise', valence:'pos', family:'surprise', synonyms:['surprised','amazed','curious']},
  ];

  const DYADS = [
    ['joy','trust','Love'], ['joy','anticipation','Optimism'],
    ['trust','anticipation','Hope'], ['surprise','joy','Delight'],
  ];

  const TYPES = ['book','music','movie','blog','podcast'];
  const TEMPOS = ['quick','steady','slow-burn'];
  const TYPE_LABELS = {book:'Books',music:'Music',movie:'Movies',blog:'Blogs',podcast:'Podcasts'};

  const CONTENT = {};
  MOODS.forEach(m=>{
    CONTENT[m.id] = {};
    TYPES.forEach(type=>{
      CONTENT[m.id][type] = TEMPOS.map((tempo,i)=>({ title:`${m.label} ${TYPE_LABELS[type].slice(0,-1)} pick ${i+1}`, tempo, type }));
    });
  });

  function findMood(id){ return MOODS.find(m=>m.id===id); }

  const familyGroups = {};
  MOODS.forEach(m=>{ (familyGroups[m.family] ??= []).push(m.id); });
  function restTarget(mood){
    const c = FAMILY_CENTROIDS[mood.family];
    const group = familyGroups[mood.family];
    if(group.length===1) return {x:c.x,y:c.y};
    const idx = group.indexOf(mood.id);
    const angle = (idx/group.length)*Math.PI*2;
    const r = 0.05;
    return { x:c.x+Math.cos(angle)*r, y:c.y+Math.sin(angle)*r };
  }

  function scoreMatch(mood, q){
    const label = mood.label.toLowerCase();
    if(label === q) return 0;
    if(label.startsWith(q)) return 1;
    for(const syn of mood.synonyms){
      if(syn === q) return 0;
      if(syn.startsWith(q)) return 2;
    }
    return null;
  }
  function resolveSearch(raw){
    const q = raw.trim().toLowerCase();
    if(!q) return null;
    let best=null, bestScore=Infinity;
    for(const m of MOODS){
      const s = scoreMatch(m,q);
      if(s!==null && s<bestScore){ bestScore=s; best=m.id; }
    }
    return best;
  }

  function getExploreTargets(moodId){
    const mood = findMood(moodId);
    const primaryId = mood.valence==='neg' ? mood.counterpart : moodId;
    const neighborIds = new Set();
    DYADS.forEach(([a,b])=>{ if(a===primaryId) neighborIds.add(b); if(b===primaryId) neighborIds.add(a); });
    MOODS.forEach(m=>{ if(m.family===findMood(primaryId).family && m.id!==primaryId) neighborIds.add(m.id); });
    neighborIds.add(primaryId);
    neighborIds.delete(moodId);
    return [...neighborIds].map(findMood);
  }

  function bubbleColor(mood){
    const hue = mood.valence==='neg' ? 4 : 208;
    const light = mood.intense ? 70 : 84;
    return `hsl(${hue} 75% ${light}%)`;
  }
  function tempoColor(tempo){
    return tempo==='quick' ? 'hsl(140 55% 82%)' : tempo==='steady' ? 'hsl(212 65% 84%)' : 'hsl(280 55% 86%)';
  }
  function tempoSize(tempo){
    return tempo==='quick' ? 76 : tempo==='steady' ? 92 : 108;
  }

  function createBubbleEl(mood){
    const el = document.createElement('div');
    el.className = 'bubble' + (mood.intense?' intense':'');
    el.style.background = bubbleColor(mood);
    el.textContent = mood.label;
    el.dataset.moodId = mood.id;
    return el;
  }

  // ---------- field (physics) ----------
  const bubblesLayer = document.getElementById('bubblesLayer');
  const state = MOODS.map(m=>{
    const rest = restTarget(m);
    return { mood:m, x:rest.x, y:rest.y, vx:0, vy:0, phase:Math.random()*Math.PI*2, el:createBubbleEl(m) };
  });
  state.forEach(s=>bubblesLayer.appendChild(s.el));

  let query = '';
  document.getElementById('searchInput').addEventListener('input', e=>{ query = e.target.value; });

  let raf, fieldRunning = true;
  function tick(t){
    if(!fieldRunning) return;
    const matchId = query ? resolveSearch(query) : null;
    const active = !!query;
    state.forEach(s=>{
      const rest = restTarget(s.mood);
      let tx=rest.x, ty=rest.y, scale=1, opacity=1;
      if(active){
        if(s.mood.id===matchId){ tx=.5; ty=.45; scale=1.4; }
        else { tx=.5+(rest.x-.5)*1.7; ty=.5+(rest.y-.5)*1.7; scale=.55; opacity=.28; }
      }
      const ax=(tx-s.x)*3, ay=(ty-s.y)*3;
      s.vx=(s.vx+ax*0.016)*0.9; s.vy=(s.vy+ay*0.016)*0.9;
      s.x+=s.vx*0.016; s.y+=s.vy*0.016;
      const jx = Math.sin(t/1400+s.phase)*0.012, jy = Math.cos(t/1600+s.phase)*0.012;
      s.el.style.left=((s.x+jx)*100)+'%'; s.el.style.top=((s.y+jy)*100)+'%';
      s.el.style.setProperty('--s', scale);
      s.el.style.opacity=opacity;
    });
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  // ---------- nav: field (depth 0) -> ring (depth 1) -> leaf (depth 2) -> expanded item (depth 3) ----------
  const stage = document.getElementById('stage');
  const ringView = document.getElementById('ringView');
  const ringTethers = document.getElementById('ringTethers');
  const ringExplore = document.getElementById('ringExplore');
  const centerBubble = document.getElementById('centerBubble');
  const leafView = document.getElementById('leafView');
  const leafHeader = document.getElementById('leafHeader');
  const leafBody = document.getElementById('leafBody');
  const backBtn = document.getElementById('backBtn');

  let openMoodId = null;
  let openTypeKey = null;
  let currentLeaf = null; // { collapseExpanded() }

  function openMood(moodId){
    openMoodId = moodId;
    const s = state.find(x=>x.mood.id===moodId);
    const rect = s.el.getBoundingClientRect();
    stage.style.transformOrigin = `${rect.left+rect.width/2}px ${rect.top+rect.height/2}px`;
    stage.classList.add('zoomed');

    const mood = findMood(moodId);
    centerBubble.textContent = mood.label;
    centerBubble.style.background = bubbleColor(mood);

    const R = 190;
    ringTethers.innerHTML = '';
    ringView.querySelectorAll('.type-bubble').forEach(el=>el.remove());
    TYPES.forEach((type,i)=>{
      const angle = (-90 + i*(360/TYPES.length)) * Math.PI/180;
      const x = R*Math.cos(angle), y = R*Math.sin(angle);
      const tb = document.createElement('div');
      tb.className = 'type-bubble';
      tb.textContent = TYPE_LABELS[type];
      tb.style.setProperty('--tx', x+'px');
      tb.style.setProperty('--ty', y+'px');
      tb.style.animationDelay = (i*0.3)+'s';
      tb.onclick = ()=>openType(type);
      ringView.appendChild(tb);
      ringTethers.insertAdjacentHTML('beforeend',
        `<line x1="50%" y1="50%" x2="calc(50% + ${x}px)" y2="calc(50% + ${y}px)" />`);
    });

    ringExplore.innerHTML = '';
    getExploreTargets(moodId).forEach(target=>{
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = target.label;
      chip.onclick = ()=>openMood(target.id);
      ringExplore.appendChild(chip);
    });

    ringView.hidden = false;
    requestAnimationFrame(()=>ringView.classList.add('show'));
    backBtn.hidden = false;
    backBtn.textContent = '← Back to field';
  }

  function closeMood(){
    openMoodId = null;
    stage.classList.remove('zoomed');
    ringView.classList.remove('show');
    backBtn.hidden = true;
    setTimeout(()=>{ ringView.hidden = true; }, 350);
  }

  function openType(typeKey){
    openTypeKey = typeKey;
    const mood = findMood(openMoodId);
    leafHeader.innerHTML = `<strong>${mood.label}</strong> → ${TYPE_LABELS[typeKey]}`;
    leafBody.innerHTML = '';
    currentLeaf = renderLeafItems(openMoodId, typeKey, CONTENT[openMoodId][typeKey]);
    leafBody.appendChild(currentLeaf.el);
    ringView.classList.remove('show');
    leafView.hidden = false;
    requestAnimationFrame(()=>leafView.classList.add('show'));
    backBtn.textContent = `← Back to ${mood.label}`;
  }

  function closeType(){
    openTypeKey = null;
    currentLeaf = null;
    leafView.classList.remove('show');
    setTimeout(()=>{ leafView.hidden = true; }, 300);
    ringView.classList.add('show');
    backBtn.textContent = `← Back to field`;
  }

  function stepBack(){
    if(openTypeKey){
      if(currentLeaf && currentLeaf.collapseExpanded()) return;
      closeType();
    } else if(openMoodId){
      closeMood();
    }
  }

  bubblesLayer.addEventListener('click', e=>{
    const b = e.target.closest('.bubble');
    if(b) openMood(b.dataset.moodId);
  });

  backBtn.onclick = stepBack;
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ stepBack(); return; }
  });

  // ---------- orbiting item-bubbles; click morphs the bubble itself in place ----------
  function renderLeafItems(moodId, typeKey, entries){
    const stageDiv = document.createElement('div');
    stageDiv.className = 'leaf-stage';
    let expandedTitle = null;

    const els = entries.map(entry=>{
      const el = document.createElement('div');
      el.className = 'item-bubble';
      el.onclick = (ev)=>{
        ev.stopPropagation();
        expandedTitle = (expandedTitle === entry.title) ? null : entry.title;
        layout();
      };
      stageDiv.appendChild(el);
      return el;
    });

    function layout(){
      entries.forEach((entry,i)=>{
        const el = els[i];
        const isExpanded = expandedTitle === entry.title;
        el.classList.toggle('expanded', isExpanded);
        if(isExpanded){
          el.style.setProperty('--tx','0px');
          el.style.setProperty('--ty','0px');
          el.style.width='240px'; el.style.height='240px';
          el.style.background = tempoColor(entry.tempo);
          el.style.opacity = 1;
          el.innerHTML = `<div class="item-detail">
            <h3>${entry.title}</h3>
            <span class="tempo tempo-${entry.tempo}">${entry.tempo}</span>
            <p>${TYPE_LABELS[typeKey].slice(0,-1)} • dummy link</p>
            <p>One-line why-this-helps note for "${entry.title}".</p>
          </div>`;
        } else {
          const angle = (-90 + i*(360/entries.length)) * Math.PI/180;
          const r = expandedTitle ? 175 : 120;
          const x = r*Math.cos(angle), y = r*Math.sin(angle);
          const size = tempoSize(entry.tempo);
          el.style.setProperty('--tx', x+'px');
          el.style.setProperty('--ty', y+'px');
          el.style.width=size+'px'; el.style.height=size+'px';
          el.style.background = tempoColor(entry.tempo);
          el.style.opacity = expandedTitle ? 0.35 : 1;
          el.textContent = entry.title;
        }
      });
    }
    layout();

    stageDiv.addEventListener('click', ()=>{
      if(expandedTitle){ expandedTitle=null; layout(); }
    });

    return {
      el: stageDiv,
      collapseExpanded(){
        if(expandedTitle){ expandedTitle=null; layout(); return true; }
        return false;
      },
    };
  }
</script>
</body>
</html>
