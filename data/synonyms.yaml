# Free-text term -> ranked mood candidates with a confidence score.
# featured: true surfaces the term as a shortcut on the empty-search home
# state (DESIGN.md names anxious/lonely/overwhelmed as the literal examples).
# See src/lib/resolveSearch.ts for how confidence decides exact vs candidates
# vs no-match.

anxious:
  term: anxious
  featured: true
  candidates:
    - mood_id: fear
      confidence: 0.92
    - mood_id: apprehension
      confidence: 0.55

