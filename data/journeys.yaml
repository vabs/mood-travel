# Curated mood journeys - NOT wheel opposites (see DESIGN.md's "Mood
# journeys, not wheel opposites" section). Each is an editorial destination
# with a short, non-clinical rationale. Only status: published journeys are
# built into pages; draft journeys are excluded entirely, including their
# recommendations.

fear-toward-trust:
  id: fear-toward-trust
  starting_mood_id: fear
  destination_mood_id: trust
  name: Toward steadiness
  rationale: >-
    When anxious energy is running high, stories built around steady,
    dependable relationships can be a quiet counterweight - not a fix, just
    something to lean on for a while.
  manageable_feelings: [calm, connection]
  status: published

fear-toward-serenity:
  id: fear-toward-serenity
  starting_mood_id: fear
  destination_mood_id: serenity
  name: Toward quiet
  rationale: >-
    Sometimes the more useful move isn't a story about safety, but something
    slow and unhurried enough to give an on-edge mind somewhere else to rest.
  manageable_feelings: [calm]
  status: published

sadness-toward-acceptance:
  id: sadness-toward-acceptance
  starting_mood_id: sadness
  destination_mood_id: acceptance
  name: Toward connection
  rationale: >-
    Sadness, especially around loss, often eases a little in the company of
    other honest accounts of the same territory - proof that it's survivable
    and that you're not doing it alone.
  manageable_feelings: [connection, reflection]
  status: published

anger-toward-pensiveness:
  id: anger-toward-pensiveness
  starting_mood_id: anger
  destination_mood_id: pensiveness
  name: Toward reflection
  rationale: >-
    Anger isn't a problem to solve away - but a slower, more reflective
    register can sometimes make room to think past the immediate charge.
    Deliberately not routed toward anger's wheel-opposite (fear); reflection
    is a more honest, achievable next step than manufactured calm.
  manageable_feelings: [reflection]
  status: draft
